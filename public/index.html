<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b14">
<title>بانک‌سیم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--s1:rgba(255,255,255,.045);--s2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--tx:#eef3ff;--mu:#8d9bb8;--ac:#4f8cff;--ac2:#8a5cff;--up:#2ee59d;--dn:#ff5d73;--gold:#f5c453;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;min-height:100vh;
background:radial-gradient(900px 500px at 85% -10%,rgba(138,92,255,.28),transparent 60%),radial-gradient(800px 500px at 0% 10%,rgba(79,140,255,.22),transparent 60%),radial-gradient(700px 400px at 50% 110%,rgba(46,229,157,.10),transparent 60%),var(--bg);background-attachment:fixed}
.w{max-width:760px;margin:0 auto;padding:14px 14px 110px}
.mu{color:var(--mu);font-size:13px}.up{color:var(--up)}.dn{color:var(--dn)}
h1,h2,h3{margin:0}h2{font-size:16px;font-weight:800}
/* header */
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.lg{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 20px rgba(79,140,255,.45);font-size:18px}
.usr{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);padding:5px 6px 5px 12px;border-radius:40px;font-size:14px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#ff9f43);color:#1b1300;font-weight:800;font-size:13px}
.ic{background:var(--s2);border:0;color:var(--mu);width:28px;height:28px;border-radius:50%;padding:0;cursor:pointer;font-size:13px}
.ic:hover{color:var(--dn)}
/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:up .45s both}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
/* bank card */
.cc{position:relative;overflow:hidden;padding:22px;border:0;color:#fff;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;
background:linear-gradient(135deg,#2a5cff 0%,#7a4dff 55%,#c04dff 100%);box-shadow:0 18px 40px rgba(90,80,255,.35)}
.cc:before,.cc:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.cc:before{width:260px;height:260px;left:-80px;top:-100px}.cc:after{width:180px;height:180px;right:-50px;bottom:-90px}
.cc>*{position:relative;z-index:1}
.cc .mu{color:rgba(255,255,255,.75)}
.cct{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.chipic{width:42px;height:30px;border-radius:7px;background:linear-gradient(135deg,#ffe29a,#e9b949);opacity:.95}
.bal{font-size:38px;font-weight:800;line-height:1.3}.bal small{font-size:15px;font-weight:400;margin-right:6px;opacity:.8}
.ccb{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.95}
/* salary */
.sal{display:flex;align-items:center;gap:18px}
.rw{position:relative;width:104px;height:104px;flex:0 0 auto}
.rw svg{width:100%;height:100%}.rb{fill:none;stroke:var(--s2);stroke-width:8}.rf{fill:none;stroke:url(#gr);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.rc{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:600;text-align:center;line-height:1.3}
.sal>div:last-child{flex:1}
/* inputs */
input,textarea{width:100%;padding:12px 14px;margin:5px 0;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--tx);font:inherit;transition:.2s}
input:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(79,140,255,.2)}
textarea{resize:vertical;min-height:80px}
button{padding:11px 20px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:.18s;box-shadow:0 6px 18px rgba(79,140,255,.3)}
button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.1)}button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
button.g{background:var(--s2);box-shadow:none;color:var(--mu)}
button.b{background:linear-gradient(135deg,#1fcf8b,#12a56d);box-shadow:0 6px 18px rgba(46,229,157,.28)}
button.s{background:linear-gradient(135deg,#ff6b81,#e5384f);box-shadow:0 6px 18px rgba(255,93,115,.28)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.full{width:100%}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>input{flex:1;min-width:120px}
.bar{height:10px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .6s}
/* nav */
.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;background:rgba(14,20,36,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:20;max-width:calc(100% - 20px)}
.nav button{background:transparent;box-shadow:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 14px;border-radius:20px;font-size:12px;min-width:64px}
.nav button b{font-size:19px;line-height:1.2;filter:grayscale(1);opacity:.7;transition:.2s}
.nav button.on{background:linear-gradient(135deg,rgba(79,140,255,.28),rgba(138,92,255,.28));color:#fff}
.nav button.on b{filter:none;opacity:1;transform:translateY(-2px) scale(1.1)}
.nav button:hover:not(:disabled){transform:none;filter:none;color:#fff}
/* stats */
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st>div{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.st b{display:block;font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* exchanges pills */
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pl{flex:0 0 auto;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;transition:.2s;min-width:120px}
.pl:hover{border-color:var(--ac)}.pl.on{background:linear-gradient(135deg,rgba(79,140,255,.25),rgba(138,92,255,.25));border-color:var(--ac)}
.pl b{display:block;font-size:14px}.pl.dead{opacity:.55}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;background:rgba(255,93,115,.18);color:var(--dn);margin-right:4px}
/* market */
.coin{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px;cursor:pointer;transition:.18s;border:1px solid transparent}
.coin:hover{background:var(--s1)}.coin.sel{background:var(--s2);border-color:var(--line)}
.cn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex:0 0 auto;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.ci{flex:1;min-width:0}.ci b{display:block;font-size:14px}
.cp{text-align:left;min-width:110px}.cp b{display:block;font-size:14px}
.chip{display:inline-block;font-size:12px;padding:0 8px;border-radius:20px;background:rgba(255,255,255,.06);direction:ltr}
.chip.up{background:rgba(46,229,157,.14)}.chip.dn{background:rgba(255,93,115,.14)}
.sp{flex:0 0 84px;height:30px}
@media(max-width:520px){.sp{display:none}.bal{font-size:30px}.sal{flex-direction:column;text-align:center}}
.big{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:6px}
.big .pr{font-size:28px;font-weight:800}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(0,0,0,.3);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{background:transparent;box-shadow:none;color:var(--mu);border-radius:11px}
.seg button.on.bu{background:linear-gradient(135deg,#1fcf8b,#12a56d);color:#fff}.seg button.on.se{background:linear-gradient(135deg,#ff6b81,#e5384f);color:#fff}
.qk{display:flex;gap:8px;margin:6px 0 10px}.qk button{flex:1;padding:7px;font-size:13px;background:var(--s2);box-shadow:none;color:var(--tx)}
.est{background:rgba(0,0,0,.25);border-radius:12px;padding:10px 14px;margin:8px 0 12px;font-size:14px;display:flex;justify-content:space-between}
/* lists */
.li{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.rk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--s2);font-weight:800;flex:0 0 auto}
.li.me{background:rgba(79,140,255,.12);border-radius:12px;border:0}
.empty{text-align:center;padding:30px 10px;color:var(--mu)}.empty b{display:block;font-size:42px;margin-bottom:6px}
/* toast */
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;width:min(420px,92vw)}
.toast{padding:12px 16px;border-radius:14px;background:rgba(18,26,46,.95);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5);animation:ti .3s both;font-size:14px;border-right:4px solid var(--up)}
.toast.err{border-right-color:var(--dn)}
@keyframes ti{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
/* auth */
.auth{max-width:400px;margin:0 auto;padding:11vh 16px 30px;text-align:center}
.auth .lg{width:68px;height:68px;font-size:32px;border-radius:22px;margin:0 auto 14px}
.auth h1{font-size:30px;font-weight:800}.auth .card{text-align:right;margin-top:22px}
.err{color:var(--dn);min-height:24px;font-size:14px}
a{color:var(--ac);text-decoration:none}
</style></head><body><div id="toasts"></div><div id="app"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],A=$('#app');
let T=localStorage.t,me,mk=[],exs=[],sel='BTC',xs=1,tab='bank',mode='login',side='buy',adm={id:0,pass:'',info:null},hist={},topL=[],cen={pass:'',data:null},DAY=864e5;
const f=n=>Math.round(n).toLocaleString('fa-IR'),d=(n,x=6)=>(+n).toLocaleString('fa-IR',{maximumFractionDigits:x});
const fa=s=>String(s).replace(/\d/g,x=>'۰۱۲۳۴۵۶۷۸۹'[x]);
const short=n=>n>=1e9?d(n/1e9,2)+' میلیارد تومان':n>=1e6?d(n/1e6,1)+' میلیون تومان':'';
const COL={BTC:'#f7931a',ETH:'#627eea',USDT:'#26a17b',TRX:'#ef0027',DOGE:'#c2a633'};
const price=s=>mk.find(x=>x.sym==s)?.price||0;
const worth=()=>me.hold.reduce((a,h)=>a+h.amt*price(h.sym),0);
const net=()=>me.balance+(worth())+(me.dep||0)-(me.loan||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,t){const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>{e.style.transition='.3s';e.style.opacity=0;setTimeout(()=>e.remove(),300)},3200)}
async function api(p,b){const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});
 const j=await r.json();if(!r.ok){if(r.status==401&&T){out()}throw Error(j.error||'خطا')}return j}
function out(){localStorage.removeItem('t');T=null;me=null;cen={pass:'',data:null};adm={id:0,pass:'',info:null};authView()}
function spark(s,w=84,h=30){const a=hist[s]||[];if(a.length<2)return'';const mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1,
 p=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-3-(v-mn)/r*(h-6)).toFixed(1)}`).join(' '),c=a[a.length-1]>=a[0]?'#2ee59d':'#ff5d73';
 return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${p}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
const avatar=s=>`<div class="cn" style="background:linear-gradient(135deg,${COL[s]||'#4f8cff'},${COL[s]||'#4f8cff'}99)">${s.slice(0,4)}</div>`;
/* ---------- auth ---------- */
function authView(e=''){A.innerHTML=`<div class="auth"><div class="lg">🏦</div><h1>بانک‌سیم</h1><p class="mu">حقوق بگیر، معامله کن، صرافی خودت رو بساز</p>
<div class="card"><h2 style="margin-bottom:8px">${mode=='login'?'ورود به حساب':'ساخت حساب جدید'}</h2>
<input id="u" placeholder="نام کاربری (انگلیسی)" autocomplete="username" dir="ltr"><input id="p" type="password" placeholder="رمز عبور" autocomplete="current-password" dir="ltr">
<div class="err" id="e">${e}</div><button class="full" id="go">${mode=='login'?'ورود':'ثبت‌نام'}</button>
<p class="mu" style="text-align:center;margin:14px 0 0"><a href="#" id="sw">${mode=='login'?'حساب ندارید؟ ثبت‌نام':'حساب دارید؟ ورود'}</a></p></div></div>`;
 $('#sw').onclick=x=>{x.preventDefault();mode=mode=='login'?'signup':'login';authView()};
 const go=async()=>{try{const j=await api(mode,{username:$('#u').value.trim(),password:$('#p').value});T=j.token;localStorage.t=T;boot()}catch(x){$('#e').textContent=x.message}};
 $('#go').onclick=go;$('#p').onkeydown=k=>{if(k.key=='Enter')go()}}
/* ---------- layout ---------- */
function head(){return`<header class="top"><div class="logo"><span class="lg">🏦</span>بانک‌سیم</div><div class="usr"><span>${me.username}</span><span class="av">${me.username[0].toUpperCase()}</span><button class="ic" id="lo" title="خروج">⏻</button></div></header>`}
function nav(){const t=[['bank','🏦','بانک'],['ex','💱','صرافی'],['wal','👛','دارایی'],['top','🏆','برترین‌ها']];if(me.mine.length)t.push(['adm','🛠','پنل من']);
 return`<nav class="nav">${t.map(x=>`<button class="${tab==x[0]?'on':''}" data-t="${x[0]}"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav>`}
function go(t){tab=t;if(t=='top')api('top').then(l=>{topL=l;if(tab=='top')draw()}).catch(()=>{});draw();scrollTo({top:0})}
/* ---------- views ---------- */
function bank(){const p=Math.min(100,me.balance/me.need*100),ok=me.balance>=me.need;
 return`<div class="card cc"><div class="cct"><span>بانک‌سیم</span><span class="chipic"></span></div>
<div><div class="mu">موجودی حساب</div><div class="bal"><span data-bal>${f(me.balance)}</span><small>تومان</small></div><div class="mu" data-balsh>${short(me.balance)}</div></div>
<div class="ccb"><span dir="ltr">@${me.username}</span><span>ثروت کل: <b data-nw>${f(net())}</b></span></div></div>
<div class="card sal"><div class="rw"><svg viewBox="0 0 100 100"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#2ee59d"/></linearGradient></defs>
<circle class="rb" cx="50" cy="50" r="44"/><circle class="rf" id="rg" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0" transform="rotate(-90 50 50)"/></svg><div class="rc" id="cd"></div></div>
<div><h2>حقوق روزانه</h2><p class="mu" style="margin:4px 0 10px">هر ۲۴ ساعت ${f(me.salary)} تومان به حساب شما واریز می‌شود.</p><button id="sal" class="full">دریافت حقوق</button></div></div>
<div class="card"><div class="hd"><h2>💸 انتقال پول</h2></div><div class="row"><input id="tt" placeholder="نام کاربری گیرنده" dir="ltr"><input id="ta" type="number" placeholder="مبلغ (تومان)"></div><button class="full" id="tr" style="margin-top:8px">ارسال</button></div>
<div class="card"><div class="hd"><h2>🏦 سپرده و وام</h2><span class="mu">سود سپرده ${d(me.dr*100,2)}٪ · سود وام ${d(me.lr*100,2)}٪ روزانه</span></div>
<div class="st" style="grid-template-columns:1fr 1fr"><div><span class="mu">سپرده</span><b class="up">${f(me.dep)}</b></div><div><span class="mu">بدهی وام</span><b class="dn">${f(me.loan)}</b></div></div>
<input id="ba" type="number" placeholder="مبلغ (تومان)" style="margin-top:10px">
<div class="two"><button class="b" id="bd">واریز به سپرده</button><button class="g" id="bw">برداشت سپرده</button><button id="bl">گرفتن وام</button><button class="s" id="br">پرداخت وام</button></div>
<p class="mu" style="margin:8px 0 0">سقف وام ۵۰٪ ثروت خالص شماست و نیمی از هر حقوق روزانه صرف بازپرداخت وام می‌شود.</p></div>
<div class="card"><div class="hd"><h2>🏗 ساخت صرافی اختصاصی</h2><span class="mu">${d(p,1)}٪</span></div>
<p class="mu" style="margin:0">ساخت صرافی ${f(me.need)} تومان هزینه دارد و کارمزد همه‌ی معاملات آن به شما می‌رسد.</p>
<div class="bar"><i style="width:${p}%"></i></div>
<input id="xn" placeholder="نام صرافی"><input id="xp" type="password" placeholder="رمز اختصاصی پنل ادمین (حداقل ۶ کاراکتر)" dir="ltr">
<button class="full" id="mx" ${ok?'':'disabled'}>${ok?'ساخت صرافی':'موجودی کافی نیست'}</button></div>
<p style="text-align:center;margin:6px 0 0"><span class="mu" data-t="cen" style="cursor:pointer;text-decoration:underline">پنل مدیریت مرکزی</span></p>`}
function ex(){const lst=mk.filter(x=>!x.ex||x.ex==xs);if(lst.length&&!lst.find(x=>x.sym==sel))sel=lst[0].sym;const m=mk.find(x=>x.sym==sel)||{name:'',price:0},h=me.hold.find(x=>x.sym==sel)?.amt||0,e=exs.find(x=>x.id==xs)||{fee:.002,bankrupt:0,name:''};
 return`<div class="pills" style="margin-bottom:14px">${exs.map(x=>`<div class="pl ${x.id==xs?'on':''} ${x.bankrupt?'dead':''}" data-x="${x.id}"><b>${x.name}</b><span class="mu">کارمزد ${d(x.fee*100,2)}٪</span>${x.bankrupt?'<span class="tag">ورشکسته</span>':''}</div>`).join('')}</div>
<div class="card"><div class="hd"><h2>📈 بازار</h2><span class="mu">به‌روزرسانی زنده</span></div>
${lst.map(x=>`<div class="coin ${x.sym==sel?'sel':''}" data-s="${x.sym}">${avatar(x.sym)}<div class="ci"><b>${x.name}</b><span class="mu">${x.sym}</span></div>
<div class="sp" data-sp="${x.sym}">${spark(x.sym)}</div><div class="cp"><b data-p="${x.sym}">${f(x.price)}</b><span class="chip ${x.change>=0?'up':'dn'}" data-c="${x.sym}">${d(x.change,2)}٪</span></div></div>`).join('')}</div>
<div class="card"><div class="big"><div><div class="mu">${m.name} · ${sel}</div><div class="pr"><span data-p="${sel}">${f(m.price)}</span> <small class="mu" style="font-size:13px">تومان</small></div></div><div class="sp" style="flex:0 0 130px;height:50px" data-sp="${sel}" data-w="130" data-h="50">${spark(sel,130,50)}</div></div>
<div class="mu" style="margin-bottom:12px">دارایی شما: <b style="color:var(--tx)">${d(h)} ${sel}</b> · کارمزد ${d(e.fee*100,2)}٪ در «${e.name}»</div>
${e.bankrupt?'<div class="err">این صرافی ورشکسته شده و معامله در آن بسته است.</div>':''}
<div class="seg"><button class="bu ${side=='buy'?'on':''}" data-side="buy">خرید</button><button class="se ${side=='sell'?'on':''}" data-side="sell">فروش</button></div>
<input id="amt" type="number" placeholder="${side=='buy'?'مبلغ خرید (تومان)':'مقدار فروش ('+sel+')'}">
<div class="qk">${[.25,.5,.75,1].map(q=>`<button data-q="${q}">${q==1?'همه':fa(q*100)+'٪'}</button>`).join('')}</div>
<div class="est"><span class="mu">${side=='buy'?'دریافتی تقریبی':'مبلغ تقریبی'}</span><b id="est">—</b></div>
<button class="full ${side=='buy'?'b':'s'}" id="go" ${e.bankrupt?'disabled':''}>${side=='buy'?'خرید':'فروش'} ${m.name}</button></div>
${xs!=1?`<div class="card"><div class="hd"><h2>📣 ثبت شکایت از «${e.name}»</h2></div><p class="mu" style="margin:0 0 6px">اگر صاحب صرافی تخلف کرده، شکایت کنید. با شکایت ۵ نفر صرافی ورشکسته می‌شود.</p><textarea id="ct" placeholder="متن شکایت (۱۰ تا ۵۰۰ حرف)"></textarea><button class="g full" id="cp">ارسال شکایت</button></div>`:''}${sendCard()}`}
function sendCard(){const o=me.hold.map(x=>{const m=mk.find(k=>k.sym==x.sym);return`<option value="${esc(x.sym)}">${esc(m?m.name:x.sym)} (${esc(x.sym)}) — ${d(x.amt)}</option>`}).join('');
 return`<div class="card"><div class="hd"><h2>📤 انتقال ارز دیجیتال</h2></div><div class="mu" style="margin-bottom:4px">آدرس ولت شما (برای دریافت)</div><div class="row"><input id="wa" value="${esc(me.wallet)}" readonly dir="ltr"><button class="g" id="wc" style="flex:0 0 auto">کپی</button></div>${me.hold.length?`<div class="mu" style="margin:10px 0 4px">ارسال به ولت دیگر</div><input id="sa" placeholder="آدرس ولت مقصد (0x...)" dir="ltr"><select id="sc" style="width:100%;margin-top:6px">${o}</select><input id="sn2" type="number" placeholder="مقدار" style="margin-top:6px"><button class="full" id="sd" style="margin-top:8px">ارسال</button>`:'<p class="mu" style="margin:10px 0 0">هنوز ارزی ندارید که ارسال کنید.</p>'}</div>`}
function wal(){const tot=worth();
 return`<div class="card"><div class="st"><div><span class="mu">موجودی نقد</span><b>${f(me.balance)}</b></div><div><span class="mu">ارزش ارزها</span><b data-hv>${f(tot)}</b></div><div><span class="mu">ثروت کل</span><b data-nw>${f(net())}</b></div></div></div>
<div class="card"><div class="hd"><h2>👛 دارایی‌های من</h2></div>${me.hold.length?me.hold.map(h=>{const m=mk.find(x=>x.sym==h.sym)||{name:h.sym};return`<div class="li" data-go="${h.sym}" style="cursor:pointer">${avatar(h.sym)}<div class="ci"><b>${m.name}</b><span class="mu">${d(h.amt)} ${h.sym}</span></div><div class="cp"><b data-v="${h.sym}" data-a="${h.amt}">${f(h.amt*price(h.sym))}</b><span class="mu">تومان</span></div></div>`}).join(''):`<div class="empty"><b>🪙</b>هنوز ارزی نخریده‌اید.<br><button style="margin-top:12px" data-t="ex">رفتن به صرافی</button></div>`}</div>`}
function topv(){const medal=['🥇','🥈','🥉'];
 return`<div class="card"><div class="hd"><h2>🏆 ثروتمندترین‌ها</h2><span class="mu">۱۰ نفر برتر</span></div>${topL.length?topL.map((u,i)=>`<div class="li ${u.username==me.username?'me':''}"><div class="rk">${medal[i]||fa(i+1)}</div><div class="ci"><b dir="ltr" style="text-align:right">${u.username}${u.username==me.username?' (شما)':''}</b><span class="mu">${short(u.wealth)}</span></div><b>${f(u.wealth)}</b></div>`).join(''):'<div class="empty"><b>⏳</b>در حال بارگذاری...</div>'}</div>`}
function admin(){const i=adm.info;
 if(!i)return`<div class="card"><div class="hd"><h2>🔐 ورود به پنل صرافی</h2></div><select id="ai" style="width:100%;padding:12px;border-radius:12px;background:rgba(0,0,0,.28);color:var(--tx);border:1px solid var(--line);font:inherit;margin-bottom:6px">${me.mine.map(x=>`<option value="${x.id}">${x.name}${x.bankrupt?' (ورشکسته)':''}</option>`).join('')}</select>
<input id="ap" type="password" placeholder="رمز اختصاصی پنل" dir="ltr"><button class="full" id="al" style="margin-top:6px">ورود</button></div>`;
 return`<div class="card"><div class="hd"><h2>${i.name} ${i.bankrupt?'<span class="tag">ورشکسته</span>':''}</h2><button class="g" id="ao" style="padding:6px 14px">خروج از پنل</button></div>
<div class="st"><div><span class="mu">کارمزد دریافتی</span><b class="up">${f(i.earned)}</b></div><div><span class="mu">حجم معاملات</span><b>${f(i.volume)}</b></div><div><span class="mu">تعداد معامله</span><b>${f(i.trades)}</b></div></div>
<button class="b full" id="wd" style="margin-top:12px" ${i.earned>0?'':'disabled'}>برداشت کارمزد به حساب</button></div>
<div class="card"><div class="hd"><h2>⚙️ تنظیمات</h2></div>
<div class="mu">کارمزد (۰ تا ۵٪)</div><div class="row"><input id="fe" type="number" step="0.1" value="${i.fee*100}"><button id="sf">ثبت</button></div>
<div class="mu" style="margin-top:8px">نام صرافی</div><div class="row"><input id="nm" value="${i.name}"><button id="sn">تغییر</button></div>
<div class="mu" style="margin-top:8px">رمز پنل</div><div class="row"><input id="np" type="password" placeholder="رمز جدید" dir="ltr"><button id="sp">تغییر</button></div></div>
<div class="card"><div class="hd"><h2>🪙 ارزهای صرافی من</h2><span class="mu">هزینه لیست ${f(me.lf)} تومان</span></div>
${(adm.coins||[]).map(c=>`<div class="li">${avatar(c.sym)}<div class="ci"><b>${esc(c.name)}</b><span class="mu">${c.sym} · ${f(c.price)} تومان</span></div><button class="s" data-dc="${c.sym}" style="padding:6px 12px">حذف</button></div>`).join('')||'<div class="mu">هنوز ارزی ثبت نکرده‌اید.</div>'}
<div class="row" style="margin-top:10px"><input id="cs" placeholder="نماد (مثلاً MYC)" dir="ltr"><input id="cn" placeholder="نام ارز"><input id="cpz" type="number" placeholder="قیمت اولیه (تومان)"></div>
<button class="full" id="lc" style="margin-top:6px">لیست ارز جدید</button>
<p class="mu" style="margin:8px 0 0">حداکثر ۳ ارز برای هر صرافی؛ ارز فقط در همین صرافی معامله می‌شود. با حذف ارز، دارندگان به قیمت روز تسویه می‌شوند.</p></div>`}
/* ---------- render ---------- */
function moneyCard(){return`<div class="card"><div class="hd"><h2>💰 افزودن پول به بازیکن</h2></div><input id="amu" placeholder="نام کاربری بازیکن" dir="ltr"><input id="ama" type="number" placeholder="مبلغ (تومان)" style="margin-top:6px"><button class="full" id="am" style="margin-top:8px">افزودن به موجودی</button></div>`}
function central(){return centralBase()+(cen.data?moneyCard():'')}
function centralBase(){const c=cen.data;
 if(!c)return`<div class="card"><div class="hd"><h2>🛡 پنل مدیریت مرکزی</h2><button class="g" id="cb" style="padding:6px 14px">بازگشت</button></div><input id="cpw" type="password" placeholder="رمز صرافی مرکزی" dir="ltr"><button class="full" id="cl" style="margin-top:6px">ورود</button></div>`;
 return`<div class="card"><div class="hd"><h2>🛡 صرافی‌ها</h2><button class="g" id="cx" style="padding:6px 14px">خروج</button></div>
${c.ex.filter(x=>x.id!=1).map(x=>`<div class="li"><div class="ci"><b>${esc(x.name)} ${x.bankrupt?'<span class="tag">ورشکسته</span>':''}</b><span class="mu">حجم ${f(x.volume)} · معامله ${f(x.trades)}</span></div>${x.bankrupt?`<button class="b" data-ci="reinstate" data-id="${x.id}" style="padding:6px 12px">بازگشایی</button>`:`<button class="s" data-ci="bankrupt" data-id="${x.id}" style="padding:6px 12px">ورشکسته</button>`}</div>`).join('')||'<div class="mu">صرافی دیگری وجود ندارد.</div>'}</div>
<div class="card"><div class="hd"><h2>📣 شکایت‌ها</h2></div>${c.complaints.map(k=>`<div class="li" style="flex-direction:column;align-items:stretch"><div><b>${esc(k.exname)}</b> <span class="mu" dir="ltr">@${esc(k.username)}</span> ${k.status=='open'?'<span class="tag">باز</span>':'<span class="mu">(رسیدگی شد)</span>'}</div><div>${esc(k.text)}</div>${k.reply?`<div class="mu">پاسخ: ${esc(k.reply)}</div>`:''}${k.status=='open'?`<div class="row"><input id="rp${k.id}" placeholder="پاسخ"><button data-rs="${k.id}" style="padding:6px 12px">رسیدگی</button></div>`:''}</div>`).join('')||'<div class="empty"><b>✅</b>شکایتی ثبت نشده.</div>'}</div>`}
function draw(){A.innerHTML=`<div class="w">${head()}${{bank,ex,wal,top:topv,adm:admin,cen:central}[tab]()}</div>${nav()}`;
 $('#lo').onclick=out;$$('[data-t]').forEach(b=>b.onclick=()=>go(b.dataset.t));
 const t=async(fn,ok)=>{try{await fn();if(ok)toast(ok);draw()}catch(x){toast(x.message,'err')}};
 const on=(id,fn)=>$('#'+id)&&($('#'+id).onclick=fn);
 const ad=(action,value,ok)=>t(async()=>{const j=await api('exchange/admin',{id:adm.id,pass:adm.pass,action,value});me=j.me;adm.info=j.ex;adm.coins=j.coins;if(action=='pass')adm.pass=value;await refresh();mk=await api('market');feed()},ok);
 on('sal',()=>t(async()=>{me=await api('salary',{})},'حقوق به حساب شما واریز شد 💰'));
 on('tr',()=>t(async()=>{me=await api('transfer',{to:$('#tt').value.trim(),amount:$('#ta').value})},'انتقال با موفقیت انجام شد'));
 const bk=a=>t(async()=>{me=await api('bank',{action:a,amount:$('#ba').value})},'انجام شد');
 on('bd',()=>bk('deposit'));on('bw',()=>bk('withdraw'));on('bl',()=>bk('borrow'));on('br',()=>bk('repay'));
 on('lc',()=>ad('coin',{sym:$('#cs').value,name:$('#cn').value,price:$('#cpz').value},'ارز لیست شد 🪙'));
 $$('[data-dc]').forEach(b=>b.onclick=()=>ad('delcoin',b.dataset.dc,'ارز حذف شد'));
 const cn=(action,id,value)=>t(async()=>{cen.data=await api('central',{pass:cen.pass,action,id,value})});
 on('cl',()=>t(async()=>{cen.pass=$('#cpw').value;cen.data=await api('central',{pass:cen.pass})}));
 on('cb',()=>go('bank'));on('cx',()=>{cen={pass:'',data:null};go('bank')});
 $$('[data-ci]').forEach(b=>b.onclick=()=>cn(b.dataset.ci,b.dataset.id));
 $$('[data-rs]').forEach(b=>b.onclick=()=>cn('resolve',b.dataset.rs,$('#rp'+b.dataset.rs).value));
 on('mx',()=>t(async()=>{me=await api('exchange/create',{name:$('#xn').value,pass:$('#xp').value});exs=await api('exchanges');tab='adm'},'صرافی شما ساخته شد 🎉'));
 on('go',()=>t(async()=>{me=await api('trade',{ex:xs,sym:sel,side,amount:$('#amt').value})},side=='buy'?'خرید انجام شد':'فروش انجام شد'));
 on('cp',()=>t(async()=>{await api('complaint',{ex:xs,text:$('#ct').value})},'شکایت شما ثبت شد'));
 on('al',()=>t(async()=>{adm.id=+$('#ai').value;adm.pass=$('#ap').value;const j=await api('exchange/admin',{id:adm.id,pass:adm.pass,action:'info'});adm.info=j.ex;adm.coins=j.coins}));
 on('ao',()=>{adm={id:0,pass:'',info:null};draw()});
 on('sd',()=>t(async()=>{me=await api('send',{to:$('#sa').value,sym:$('#sc').value,amount:$('#sn2').value})},'ارز ارسال شد ✅'));
 on('wc',()=>{try{navigator.clipboard.writeText(me.wallet);toast('آدرس کپی شد')}catch(e){$('#wa').select()}});
 on('am',()=>t(async()=>{cen.data=await api('central',{pass:cen.pass,action:'addmoney',to:$('#amu').value.trim(),value:$('#ama').value})},'پول به حساب بازیکن اضافه شد 💰'));
 on('wd',()=>ad('withdraw',0,'کارمزد به حساب شما واریز شد'));on('sf',()=>ad('fee',$('#fe').value,'کارمزد ثبت شد'));
 on('sn',()=>ad('rename',$('#nm').value,'نام تغییر کرد'));on('sp',()=>ad('pass',$('#np').value,'رمز تغییر کرد'));
 $$('[data-x]').forEach(p=>p.onclick=()=>{xs=+p.dataset.x;draw()});
 $$('[data-s]').forEach(r=>r.onclick=()=>{sel=r.dataset.s;draw()});
 $$('[data-go]').forEach(r=>r.onclick=()=>{sel=r.dataset.go;const cc=mk.find(x=>x.sym==sel);if(cc&&cc.ex)xs=cc.ex;go('ex')});
 $$('[data-side]').forEach(b=>b.onclick=()=>{side=b.dataset.side;draw()});
 $$('[data-q]').forEach(b=>b.onclick=()=>{const q=+b.dataset.q,v=side=='buy'?Math.floor(me.balance*q):(me.hold.find(x=>x.sym==sel)?.amt||0)*q;$('#amt').value=side=='buy'?v:+v.toFixed(8);est()});
 if($('#amt'))$('#amt').oninput=est;
 live()}
/* live bits: updated without a full redraw so typing is never interrupted */
function est(){const el=$('#est');if(!el)return;const a=+$('#amt').value,e=exs.find(x=>x.id==xs)||{fee:.002},p=price(sel);
 el.textContent=!(a>0)?'—':side=='buy'?d((a-a*e.fee)/p,8)+' '+sel:f(a*p*(1-e.fee))+' تومان'}
function tick(){if(!me)return;const s=Math.max(0,me.next-Date.now()),b=$('#sal');
 if(b){b.disabled=s>0;b.textContent=s>0?'حقوق بعدی در '+clock(s):'دریافت حقوق'}
 const c=$('#cd');if(c)c.innerHTML=s>0?clock(s):'آماده ✅';
 const r=$('#rg');if(r)r.style.strokeDashoffset=(276.46*(s/DAY)).toFixed(2)}
const clock=ms=>{const t=Math.floor(ms/1e3),p=n=>String(n).padStart(2,'0');return fa(p(Math.floor(t/3600))+':'+p(Math.floor(t%3600/60))+':'+p(t%60))};
function live(){mk.forEach(x=>{$$(`[data-p="${x.sym}"]`).forEach(e=>e.textContent=f(x.price));
  $$(`[data-c="${x.sym}"]`).forEach(e=>{e.textContent=d(x.change,2)+'٪';e.className='chip '+(x.change>=0?'up':'dn')});
  $$(`[data-sp="${x.sym}"]`).forEach(e=>e.innerHTML=spark(x.sym,+e.dataset.w||84,+e.dataset.h||30))});
 $$('[data-v]').forEach(e=>e.textContent=f(+e.dataset.a*price(e.dataset.v)));
 $$('[data-hv]').forEach(e=>e.textContent=f(worth()));$$('[data-nw]').forEach(e=>e.textContent=f(net()));est();tick()}
function feed(){mk.forEach(x=>{const h=hist[x.sym]||(hist[x.sym]=[x.price/(1+x.change/100)]);h.push(x.price);if(h.length>40)h.shift()})}
async function refresh(){me=await api('me');exs=await api('exchanges')}
async function boot(){try{await refresh();mk=await api('market');feed();draw()}catch(x){authView()}}
setInterval(async()=>{if(T&&me){try{mk=await api('market');feed();live()}catch(x){}}},5000);
setInterval(tick,1000);
T?boot():authView();
</script></body></html>
