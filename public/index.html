<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بانک‌سیم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1726;--card:#16233a;--line:#26385a;--tx:#e8eef9;--mu:#8fa3c4;--ac:#2f80ff;--up:#21c17a;--dn:#ef4f5f;--gold:#e9b949}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
.w{max-width:880px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
h1{font-size:20px;margin:0;font-weight:800}h2{font-size:16px;margin:0 0 12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
input{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
button{padding:10px 18px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}button.g{background:transparent;border:1px solid var(--line);color:var(--mu)}
button.s{background:var(--dn)}button.b{background:var(--up)}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bal{font-size:34px;font-weight:800;color:var(--gold)}.mu{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}th{color:var(--mu);font-weight:400;font-size:13px}
tr.m{cursor:pointer}tr.m:hover,tr.sel{background:#1b2c49}.up{color:var(--up)}.dn{color:var(--dn)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.err{color:var(--dn);min-height:22px;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}
.scroll{overflow-x:auto}
</style></head><body><div class="w" id="app"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app');let T=localStorage.t,me,mk=[],exs=[],sel='BTC',xs=1,tab='bank',mode='login',adm={id:0,pass:'',info:null};
const f=n=>Math.round(n).toLocaleString('fa-IR'),d=(n,x=6)=>(+n).toLocaleString('fa-IR',{maximumFractionDigits:x});
async function api(p,b){const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});
 const j=await r.json();if(!r.ok){if(r.status==401&&T){out()}throw Error(j.error||'خطا')}return j}
function out(){localStorage.removeItem('t');T=null;me=null;adm={id:0,pass:'',info:null};authView()}
function authView(e=''){A.innerHTML=`<div class="w" style="max-width:380px;padding-top:12vh"><h1 style="text-align:center;margin-bottom:16px">بانک‌سیم</h1>
<div class="c"><h2>${mode=='login'?'ورود به حساب':'ساخت حساب جدید'}</h2>
<input id="u" placeholder="نام کاربری (انگلیسی)" autocomplete="username" dir="ltr"><input id="p" type="password" placeholder="رمز عبور" autocomplete="current-password" dir="ltr">
<div class="err" id="e">${e}</div><button style="width:100%" id="go">${mode=='login'?'ورود':'ثبت‌نام'}</button>
<p class="mu" style="text-align:center;margin:12px 0 0"><a href="#" id="sw" style="color:var(--ac)">${mode=='login'?'حساب ندارید؟ ثبت‌نام':'حساب دارید؟ ورود'}</a></p></div></div>`;
 $('#sw').onclick=x=>{x.preventDefault();mode=mode=='login'?'signup':'login';authView()};
 $('#go').onclick=async()=>{try{const j=await api(mode,{username:$('#u').value.trim(),password:$('#p').value});T=j.token;localStorage.t=T;boot()}catch(x){$('#e').textContent=x.message}}}
function head(){return`<header><h1>بانک‌سیم</h1><span class="mu">${me.username} <button class="g" id="lo" style="padding:4px 10px">خروج</button></span></header>
<div class="tabs"><button class="${tab=='bank'?'':'g'}" data-t="bank">بانک</button><button class="${tab=='ex'?'':'g'}" data-t="ex">صرافی</button>${me.mine.length?`<button class="${tab=='adm'?'':'g'}" data-t="adm">پنل صرافی من</button>`:''}</div>`}
function bind(){$('#lo').onclick=out;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()})}
function left(){const s=Math.max(0,me.next-Date.now());return s?`${d(Math.floor(s/36e5),0)} ساعت و ${d(Math.floor(s%36e5/6e4),0)} دقیقه دیگر`:''}
function bank(){const p=Math.min(100,me.balance/me.need*100),ok=me.balance>=me.need;
 return`<div class="c"><div class="mu">موجودی حساب</div><div class="bal">${f(me.balance)} <span class="mu">تومان</span></div></div>
<div class="c"><h2>حقوق روزانه</h2><p class="mu">هر ۲۴ ساعت ${f(me.salary)} تومان به حساب شما واریز می‌شود.</p>
<button id="sal" ${left()?'disabled':''}>${left()?'حقوق بعدی: '+left():'دریافت حقوق'}</button><div class="err" id="e"></div></div>
<div class="c"><h2>ساخت صرافی جدید</h2><p class="mu">همه می‌توانند در صرافی مرکزی معامله کنند. ساخت صرافی اختصاصی ${f(me.need)} تومان هزینه دارد و کارمزد معاملات به صاحب صرافی می‌رسد.</p>
<div class="bar"><i style="width:${p}%"></i></div><p class="mu">${d(p,1)}٪ از هزینه</p>
<input id="xn" placeholder="نام صرافی"><input id="xp" type="password" placeholder="رمز اختصاصی پنل ادمین (حداقل ۶ کاراکتر)" dir="ltr">
<button id="mx" ${ok?'':'disabled'}>ساخت صرافی</button><div class="err" id="e2"></div></div>`}
function ex(){const m=mk.find(x=>x.sym==sel)||{name:''},h=me.hold.find(x=>x.sym==sel)?.amt||0,e=exs.find(x=>x.id==xs)||{fee:.002};
 return`<div class="c"><h2>انتخاب صرافی</h2><select id="exs" style="width:100%;padding:10px;border-radius:8px;background:var(--bg);color:var(--tx);border:1px solid var(--line);font:inherit">${exs.map(x=>`<option value="${x.id}" ${x.id==xs?'selected':''}>${x.name} — کارمزد ${d(x.fee*100,2)}٪</option>`).join('')}</select></div>
<div class="c scroll"><h2>بازار</h2><table><tr><th>ارز</th><th>قیمت (تومان)</th><th>تغییر</th></tr>${mk.map(x=>`<tr class="m ${x.sym==sel?'sel':''}" data-s="${x.sym}"><td>${x.name} <span class="mu">${x.sym}</span></td><td>${f(x.price)}</td><td class="${x.change>=0?'up':'dn'}" dir="ltr">${d(x.change,2)}٪</td></tr>`).join('')}</table></div>
<div class="c"><h2>معامله ${m.name}</h2><p class="mu">دارایی شما: ${d(h)} ${sel} · کارمزد ${d(e.fee*100,2)}٪</p>
<div class="row"><div><input id="bu" type="number" placeholder="مبلغ خرید (تومان)"><button class="b" style="width:100%" id="buy">خرید</button></div>
<div><input id="se" type="number" placeholder="مقدار فروش (${sel})"><button class="s" style="width:100%" id="sell">فروش</button></div></div><div class="err" id="e"></div></div>`}
function admin(){const i=adm.info;
 if(!i)return`<div class="c"><h2>ورود به پنل ادمین</h2><select id="ai" style="width:100%;padding:10px;border-radius:8px;background:var(--bg);color:var(--tx);border:1px solid var(--line);font:inherit">${me.mine.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select>
<input id="ap" type="password" placeholder="رمز اختصاصی پنل" dir="ltr"><div class="err" id="e"></div><button id="al">ورود</button></div>`;
 return`<div class="c"><h2>${i.name}</h2><div class="row"><div><div class="mu">کارمزد دریافتی</div><div class="bal" style="font-size:22px">${f(i.earned)}</div></div><div><div class="mu">حجم معاملات</div><b>${f(i.volume)}</b></div><div><div class="mu">تعداد معامله</div><b>${f(i.trades)}</b></div></div>
<p></p><button id="wd" ${i.earned>0?'':'disabled'}>برداشت کارمزد به حساب</button></div>
<div class="c"><h2>تنظیمات</h2><div class="row"><input id="fe" type="number" step="0.1" value="${i.fee*100}" placeholder="کارمزد ٪"><button id="sf" style="flex:0 0 auto">ثبت کارمزد (۰ تا ۵٪)</button></div>
<div class="row"><input id="nm" value="${i.name}"><button id="sn" style="flex:0 0 auto">تغییر نام</button></div>
<div class="row"><input id="np" type="password" placeholder="رمز جدید پنل" dir="ltr"><button id="sp" style="flex:0 0 auto">تغییر رمز</button></div>
<div class="err" id="e"></div><button class="g" id="ao">خروج از پنل</button></div>`}
async function refresh(){me=await api('me');exs=await api('exchanges')}
function draw(){const a=document.activeElement?.id,v=a?document.activeElement.value:'';
 A.innerHTML=`<div class="w">${head()}${tab=='bank'?bank():tab=='ex'?ex():admin()}</div>`;bind();
 const t=async(fn,id='e')=>{try{await fn();draw()}catch(x){const e=$('#'+id);if(e)e.textContent=x.message}};
 const ad=(action,value)=>t(async()=>{const j=await api('exchange/admin',{id:adm.id,pass:adm.pass,action,value});me=j.me;adm.info=j.ex;if(action=='pass')adm.pass=value;await refresh()});
 const on=(id,fn)=>$('#'+id)&&($('#'+id).onclick=fn);
 on('sal',()=>t(async()=>{me=await api('salary',{})}));
 on('mx',()=>t(async()=>{me=await api('exchange/create',{name:$('#xn').value,pass:$('#xp').value});exs=await api('exchanges');tab='adm'},'e2'));
 on('buy',()=>t(async()=>{me=await api('trade',{ex:xs,sym:sel,side:'buy',amount:$('#bu').value})}));
 on('sell',()=>t(async()=>{me=await api('trade',{ex:xs,sym:sel,side:'sell',amount:$('#se').value})}));
 on('al',()=>t(async()=>{adm.id=+$('#ai').value;adm.pass=$('#ap').value;const j=await api('exchange/admin',{id:adm.id,pass:adm.pass,action:'info'});adm.info=j.ex}));
 on('ao',()=>{adm={id:0,pass:'',info:null};draw()});
 on('wd',()=>ad('withdraw'));on('sf',()=>ad('fee',$('#fe').value));on('sn',()=>ad('rename',$('#nm').value));on('sp',()=>ad('pass',$('#np').value));
 $('#exs')&&($('#exs').onchange=e=>{xs=+e.target.value;draw()});
 document.querySelectorAll('[data-s]').forEach(r=>r.onclick=()=>{sel=r.dataset.s;draw()});
 if(a&&$('#'+a)&&$('#'+a).tagName=='INPUT'){$('#'+a).value=v;$('#'+a).focus()}}
async function boot(){try{await refresh();mk=await api('market');draw()}catch(x){authView()}}
setInterval(async()=>{if(T&&me&&tab=='ex'&&!/INPUT|SELECT/.test(document.activeElement.tagName)){try{mk=await api('market');draw()}catch(x){}}},5000);
T?boot():authView();
</script></body></html>
